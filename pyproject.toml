[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-agent-reliability-eval"
version = "0.1.0"
description = "A configurable evaluation framework for reliability failures in tool-using AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.5,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.12,<1",
]

[project.scripts]
agent-eval = "agent_eval.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

